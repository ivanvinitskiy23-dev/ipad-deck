<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Night Drive</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: Helvetica, Arial, sans-serif; }

    #stage {
      position: relative;
      height: 100%; width: 100%;
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
      -webkit-box-sizing: border-box; box-sizing: border-box;
    }

    #hud {
      position: relative; z-index: 6;
      padding: 36px 12px 8px;
      -webkit-box-sizing: border-box; box-sizing: border-box;
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
      -webkit-box-align: stretch; -webkit-align-items: stretch; align-items: stretch;
      -webkit-flex-shrink: 0; flex-shrink: 0;
    }
    #hud .card {
      border: 1px solid #333;
      background: rgba(8,8,10,0.9);
      padding: 0 10px;
      min-width: 0;
      height: 58px; min-height: 58px; max-height: 58px;
      -webkit-box-sizing: border-box; box-sizing: border-box;
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
      -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
      overflow: hidden;
    }
    #hud .lv-weather, #hud .lv-alert {
      -webkit-flex-shrink: 0; flex-shrink: 0;
      color: #ccc; font-size: 11px; line-height: 1.2;
    }
    #hud .lv-weather { width: 150px; margin-right: 6px; text-align: left; }
    #hud .lv-alert {
      width: 118px; margin-left: 6px; text-align: center;
      font-weight: 700; letter-spacing: 0.1em;
      color: #6B6B6B; border-color: #333 !important;
      background: rgba(20,20,24,0.92) !important;

    #hud .lv-k {

      text-transform: uppercase; opacity: 0.5; margin-bottom: 3px;
    }
    #hud .lv-v { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #hud .lv-alert .lv-v { font-size: 13px; }
    #hud .lv-sub {
      display: block; margin-top: 2px; font-size: 9px; font-weight: 500;
      opacity: 0.65; text-transform: none; letter-spacing: 0;
    }
    #hud .lv-alert.on {
      border-color: #FF4D6D !important;
      background: rgba(48,8,16,0.95) !important;
      color: #FF4D6D;
      -webkit-box-shadow: 0 0 16px rgba(255,77,109,0.55);
      box-shadow: 0 0 16px rgba(255,77,109,0.55);
    }

    #hud .hud-player {
      width: 300px; max-width: 46%;
      -webkit-box-orient: horizontal; -webkit-flex-direction: row; flex-direction: row;
      -webkit-box-align: center; -webkit-align-items: center; align-items: center;
      color: #ddd;
    }
    #hud #art {
      display: none; width: 40px; height: 40px; margin-right: 8px;
      border: 1px solid #333; background: #111; object-fit: cover;
      -webkit-flex-shrink: 0; flex-shrink: 0;
    }
    #hud #art.on { display: block; }
    #hud .hud-meta { min-width: 0; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
    #hud .cap {
      margin: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #hud .src {
      margin-top: 2px; font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; color: #888;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #hud #eq {
      margin: 4px 0 0; height: 12px;
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-align: end; -webkit-align-items: flex-end; align-items: flex-end;
    }
    #hud #eq span {
      display: block; width: 3px; margin: 0 1px; height: 3px; background: #4CC9F0;
    }

    #wrap {
      position: relative;
      -webkit-box-flex: 1; -webkit-flex: 1 1 auto; flex: 1 1 auto;
      /* iOS iframe: min-height:0 collapses stage to black — keep real height */
      min-height: 180px;
      margin: 0 8px 4px;
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-align: center; -webkit-align-items: center; align-items: center;
      -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
      background: #000;
      overflow: hidden;
    }
    #wrap img.scene-gif {
      display: block;
      visibility: hidden;
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      margin: auto;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #wrap img.scene-gif.on {
      visibility: visible;
    }
    canvas {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 2px solid #222;
      background: #000;
      -webkit-box-sizing: border-box; box-sizing: border-box;
      -webkit-transform: translateZ(0);
      display: block;
    }

    #ticker {
      position: relative;
      -webkit-flex-shrink: 0; flex-shrink: 0;
      height: 26px;
      overflow: hidden; background: rgba(0,0,0,0.88); border-top: 1px solid #222; z-index: 5;
    }
    #ticker .ticker-clip { overflow: hidden; height: 24px; width: 100%; white-space: nowrap; }
    #ticker .ticker-track {
      display: inline-block; white-space: nowrap; padding-top: 4px;
      font-size: 11px; color: #C8B84A;
      -webkit-transform: translateX(0); transform: translateX(0);
    }
    #ticker .ticker-track span { display: inline-block; padding: 0 14px; }
    #ticker .ticker-track .sep { opacity: 0.45; padding: 0 2px; }

    /* Background fill under dock: scene only, cover the void */
    body.fill #hud,
    body.fill #ticker { display: none !important; }
    body.fill #wrap {
      margin: 0;
      -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
      min-height: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    body.fill #stage {
      height: 100%;
    }
    body.fill canvas {
      border: 0;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="hud">
      <div class="card lv-weather">
        <span class="lv-k">Weather</span>
        <span class="lv-v" id="lvWeatherVal">Kyiv · …</span>
      </div>
      <div class="card hud-player">
        <img id="art" alt="" width="40" height="40" />
        <div class="hud-meta">
          <div class="cap" id="cap">neo-tokyo night drive</div>
          <div class="src" id="src"></div>
          <div id="eq"></div>
        </div>
      </div>
      <div class="card lv-alert" id="lvAlert">
        <span class="lv-k">Alert</span>
        <span class="lv-v" id="lvAlertVal">…</span>
        <span class="lv-sub" id="lvAlertSub">Kyiv</span>
      </div>
    </div>

    <div id="wrap"><img id="sceneGif" class="scene-gif" alt="" /><canvas id="c" width="320" height="180"></canvas></div>

    <div id="ticker">
      <div class="ticker-clip">
        <div class="ticker-track" id="tickerTrack"><span>лента…</span></div>
      </div>
    </div>
  </div>

  <script src="gadget-core.js?v=51"></script>
  <script>
    (function () {
      function param(name) {
        var q = window.location.search || "";
        var m = q.match(new RegExp("[?&]" + name + "=([^&]*)"));
        return m ? decodeURIComponent(m[1]) : "";
      }

      var GC = window.GadgetCore;
      var hubParam = param("hub");
      /* Never install HTTP hub into HTTPS page (mixed content kills media XHR) */
      if (hubParam && GC && !(location.protocol === "https:" && /^http:\/\//i.test(hubParam))) {
        try { GC.setHubBase(hubParam); } catch (e) {}
      }
      function hubPath(path) {
        /* API only — static already same-origin */
        if (!path) path = "/";
        if (path.charAt(0) !== "/") path = "/" + path;
        return GC ? GC.apiUrl(path) : path;
      }

      var theme = (param("theme") || "C").toUpperCase();
      if (theme !== "B" && theme !== "C" && theme !== "D") theme = "C";
      var scene = param("scene") || "drive";
      if (scene !== "rain" && scene !== "vinyl" && scene !== "ramen") scene = "drive";
      var canvas = null;
      var sceneGif = null;
      var gifOn = false;

      function sceneFile(name, th) {
        if (name === "ramen") return "art/pack-ramen.gif?v=51";
        return "art/scene-" + name + "-" + th + ".gif?v=51";
      }

      window.swapScene = function (next, nextTheme) {
        if (nextTheme === "B" || nextTheme === "C" || nextTheme === "D") theme = nextTheme;
        if (next !== "rain" && next !== "vinyl" && next !== "ramen") next = "drive";
        if (next === scene && gifOn) {
          try { fitCanvas(); } catch (e0) {}
          return;
        }
        scene = next;
        gifOn = false;
        if (sceneGif) {
          sceneGif.className = "scene-gif on";
          sceneGif.src = sceneFile(scene, theme);
        }
      };
      var bmp = new Image();
      var bmpReady = false;
      var themed = null;
      function hueLerp(a, b, k) {
        var d = b - a;
        if (d > 180) d -= 360;
        if (d < -180) d += 360;
        var h = a + d * k;
        if (h < 0) h += 360;
        if (h >= 360) h -= 360;
        return h;
      }
      function rgb2hsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        var max = r, min = r;
        if (g > max) max = g;
        if (b > max) max = b;
        if (g < min) min = g;
        if (b < min) min = b;
        var h = 0, s = 0, l = (max + min) / 2, d = max - min;
        if (d > 0.001) {
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          if (max === r) h = ((g - b) / d) % 6;
          else if (max === g) h = (b - r) / d + 2;
          else h = (r - g) / d + 4;
          h *= 60;
          if (h < 0) h += 360;
        }
        return [h, s, l];
      }
      function hsl2rgb(h, s, l) {
        var c = (1 - Math.abs(2 * l - 1)) * s;
        var hp = h / 60;
        var x = c * (1 - Math.abs((hp % 2) - 1));
        var r = 0, g = 0, b = 0;
        if (hp < 1) { r = c; g = x; }
        else if (hp < 2) { r = x; g = c; }
        else if (hp < 3) { g = c; b = x; }
        else if (hp < 4) { g = x; b = c; }
        else if (hp < 5) { r = x; b = c; }
        else { r = c; b = x; }
        var m = l - c / 2;
        return [((r + m) * 255 + 0.5) | 0, ((g + m) * 255 + 0.5) | 0, ((b + m) * 255 + 0.5) | 0];
      }
      function paintTheme(data) {
        var i, r, g, b, hsl, h, s, l, out, red;
        for (i = 0; i < data.length; i += 4) {
          r = data[i]; g = data[i + 1]; b = data[i + 2];
          hsl = rgb2hsl(r, g, b);
          h = hsl[0]; s = hsl[1]; l = hsl[2];
          red = (h < 22 || h > 344) && s > 0.28;
          if (!red && s > 0.1) {
            if (theme === "B") {
              h = hueLerp(h, 172, 0.72);
              s = s * 0.9;
            } else if (theme === "D") {
              h = hueLerp(h, 44, 0.78);
              s = s * 0.42;
            } else if (h >= 180 && h <= 265) {
              h = hueLerp(h, 188, 0.55);
            } else if (h > 265 && h < 344) {
              h = hueLerp(h, 332, 0.5);
            }
          }
          out = hsl2rgb(h, s, l);
          data[i] = out[0];
          data[i + 1] = out[1];
          data[i + 2] = out[2];
        }
      }
      function buildThemed() {
        try {
          var c = document.createElement("canvas");
          c.width = bmp.width;
          c.height = bmp.height;
          var gx = c.getContext("2d");
          gx.drawImage(bmp, 0, 0);
          var im = gx.getImageData(0, 0, c.width, c.height);
          paintTheme(im.data);
          gx.putImageData(im, 0, 0);
          themed = c;
        } catch (eT) {
          themed = null;
        }
      }
      bmp.onload = function () {
        bmpReady = true;
        buildThemed();
        lastFitKey = "";
        try { fitCanvas(); } catch (eFit) {}
      };
      var fillMode = param("fill") === "1";
      var pageMode = param("mode") || "deck";
      if (fillMode) {
        document.body.className = (document.body.className ? document.body.className + " " : "") + "fill";
      }

      var palettes = {
        B: {
          sky0: "#0B0E16", sky1: "#141A28", sky2: "#1A2233",
          road: "#12151C", curb: "#2A3142", line: "#5EEAD4",
          build: ["#151A24", "#1B2230", "#202838", "#171D28"],
          neon: ["#5EEAD4", "#2DD4BF", "#99F6E4"],
          winOn: "#D9F99D", winOff: "#252B38",
          car: "#E2E8F0", carDark: "#64748B", carMid: "#94A3B8", light: "#ECFDF5",
          rain: 4, caption: "pixel tatami · cruise",
          border: "#2A3142", capColor: "#5EEAD4", eq: "#5EEAD4",
          cardBg: "rgba(16,18,24,0.94)", ticker: "#A8D8D0"
        },
        C: {
          sky0: "#05060F", sky1: "#0C1020", sky2: "#161028",
          road: "#0E0C16", curb: "#2A2038", line: "#FFD60A",
          build: ["#12101C", "#181426", "#1E1630", "#151220"],
          neon: ["#FF4D6D", "#4CC9F0", "#C77DFF"],
          winOn: "#FFE08A", winOff: "#2A2438",
          car: "#E85D4C", carDark: "#8A2F28", carMid: "#C44A3C", light: "#FFF1A8",
          rain: 14, caption: "shibuya rain · night drive",
          border: "#3A2A55", capColor: "#FF4D6D", eq: "#4CC9F0",
          cardBg: "rgba(10,12,20,0.94)", ticker: "#C8A0E8"
        },
        D: {
          sky0: "#050505", sky1: "#0A0A0A", sky2: "#121212",
          road: "#0C0C0C", curb: "#262626", line: "#FFD21A",
          build: ["#101010", "#141414", "#181818", "#1C1C1C"],
          neon: ["#FFD21A", "#E8C547"],
          winOn: "#FFD21A", winOff: "#1A1A1A",
          car: "#F5F5F0", carDark: "#3A3A3A", carMid: "#C8C8C0", light: "#FFF8D6",
          rain: 0, caption: "wabi console · silence",
          border: "#262626", capColor: "#E8C547", eq: "#E8C547",
          cardBg: "rgba(12,12,12,0.95)", ticker: "#E0C83A"
        }
      };

      var P = palettes[theme];
      document.body.style.background = P.sky0;
      document.getElementById("cap").style.color = P.capColor;
      document.getElementById("c").style.borderColor = P.border;
      document.getElementById("ticker").style.borderTopColor = P.border;
      document.getElementById("tickerTrack").style.color = P.ticker;

      var cards = document.querySelectorAll("#hud .card");
      for (var i = 0; i < cards.length; i++) {
        cards[i].style.borderColor = P.border;
        cards[i].style.background = P.cardBg;
      }
      var st = document.createElement("style");
      st.textContent =
        "#hud .lv-weather .lv-v{color:" + P.eq + "}" +
        "#hud .lv-alert.on{border-color:#FF4D6D!important;background:rgba(48,8,16,0.95)!important;color:#FF4D6D;" +
        "-webkit-box-shadow:0 0 16px rgba(255,77,109,0.55);box-shadow:0 0 16px rgba(255,77,109,0.55)}" +
        "#hud #eq span{background:" + P.eq + "}";
      document.head.appendChild(st);

      var eqNodes = [];
      var eq = document.getElementById("eq");
      for (var e = 0; e < 12; e++) {
        var sp = document.createElement("span");
        eq.appendChild(sp);
        eqNodes.push(sp);
      }

      var canvas = document.getElementById("c");
      var sceneGif = document.getElementById("sceneGif");
      canvas.style.display = "none";
      var wrap = document.getElementById("wrap");
      var ctx = canvas.getContext("2d");
      // Logical resolution — integer CSS scale keeps pixels crisp (no stretch blob).
      var LW = 320, LH = 180;
      var W = LW, H = LH, t = 0;
      var HORIZON = 118;
      var media = { playing: false, title: "", artist: "" };

      var lastFitKey = "";
      function fitCanvas() {
        var boxW = wrap.clientWidth;
        var boxH = wrap.clientHeight;
        var stage = document.getElementById("stage");
        var hud = document.getElementById("hud");
        var ticker = document.getElementById("ticker");
        if (stage && hud && ticker) {
          var fitH = stage.clientHeight - hud.offsetHeight - ticker.offsetHeight - 8;
          if (fitH > 80) {
            wrap.style.height = fitH + "px";
            boxH = fitH;
          }
        }
        if (boxW < 2) boxW = window.innerWidth || 640;
        if (boxH < 2) boxH = Math.max(160, (window.innerHeight || 360) - 160);
        var tw = boxW;
        var th = boxH;
        if (gifOn) {
          var GW = sceneGif.naturalWidth || 480;
          var GH = sceneGif.naturalHeight || 270;
          var gs = Math.min(tw / GW, th / GH);
          if (!(gs > 0)) gs = 1;
          sceneGif.style.position = "absolute";
          sceneGif.style.left = "0";
          sceneGif.style.right = "0";
          sceneGif.style.top = "0";
          sceneGif.style.bottom = "0";
          sceneGif.style.marginLeft = "auto";
          sceneGif.style.marginRight = "auto";
          sceneGif.style.marginTop = "auto";
          sceneGif.style.marginBottom = "auto";
          sceneGif.style.width = Math.round(GW * gs) + "px";
          sceneGif.style.height = Math.round(GH * gs) + "px";
          return;
        }
        if (bmpReady && bmp.width) {
          var IW = bmp.width;
          var IH = bmp.height;
          var keyB = "b" + tw + "x" + th + ":" + IW;
          if (canvas.width !== IW || canvas.height !== IH) {
            canvas.width = IW;
            canvas.height = IH;
          }
          if (keyB === lastFitKey) return;
          lastFitKey = keyB;
          var s = Math.min(tw / IW, th / IH);
          if (!(s > 0)) s = 1;
          canvas.style.width = Math.round(IW * s) + "px";
          canvas.style.height = Math.round(IH * s) + "px";
          return;
        }
        var key = tw + "x" + th + (fillMode ? "f" : "c");
        if (key === lastFitKey && canvas.width === LW) return;
        lastFitKey = key;
        canvas.width = LW;
        canvas.height = LH;
        if (fillMode) {
          var sx = tw / LW;
          var sy = th / LH;
          var scale = Math.max(sx, sy);
          if (!(scale > 0)) scale = 1;
          canvas.style.width = Math.round(LW * scale) + "px";
          canvas.style.height = Math.round(LH * scale) + "px";
        } else {
          var isx = Math.floor(tw / LW);
          var isy = Math.floor(th / LH);
          var iscale = Math.max(1, Math.min(isx, isy));
          if (iscale < 2 && th >= LH * 1.5) iscale = 2;
          canvas.style.width = (LW * iscale) + "px";
          canvas.style.height = (LH * iscale) + "px";
        }
        W = LW;
        H = LH;
      }
      window.fitCanvasPublic = function () {
        lastFitKey = "";
        fitCanvas();
      };

      function rnd(n) { return (Math.random() * n) | 0; }
      function px(x, y, c) {
        ctx.fillStyle = c;
        ctx.fillRect(x | 0, y | 0, 1, 1);
      }
      function rect(x, y, w, h, c) {
        ctx.fillStyle = c;
        ctx.fillRect(x | 0, y | 0, w | 0, h | 0);
      }
      function wrapX(x, span) {
        var m = x % span;
        if (m < 0) m += span;
        return m;
      }

      var buildings = [];
      var CITY_SPAN = 0;
      function buildCity() {
        buildings = [];
        var x = 0;
        var n = 0;
        while (x < LW * 5) {
          var bw = 16 + rnd(28);
          var bh = 36 + rnd(70);
          buildings.push({
            x: x, w: bw, h: bh,
            c: P.build[rnd(P.build.length)],
            neon: P.neon[rnd(P.neon.length)],
            // Stable lit windows — no time flicker
            seed: n * 17 + bw,
            // Billboard only when building fits text (23px) + pads
            banner: (n % 4 === 1) && bw >= 34
          });
          x += bw + 2 + rnd(6);
          n++;
        }
        CITY_SPAN = x;
      }
      buildCity();

      var stars = [];
      for (var s = 0; s < 48; s++) stars.push({ x: rnd(LW), y: rnd(50), a: 0.2 + Math.random() * 0.6 });

      var carColors = {
        body: P.car,
        dark: P.carDark,
        glass: (theme === "D" ? "#1A1A14" : "#1A2840"),
        glassLite: P.light,
        tire: "#111111",
        rim: "#C8C8C0",
        tail: "#FF2D55",
        head: "#FFF6C0",
        shadow: "#050505",
        mid: P.carMid
      };

      /**
       * Procedural coupe — readable silhouette at any integer scale.
       * Unit grid ~24 wide × 11 tall, then multiplied by `s`.
       */
      function drawCarShape(ox, oy, s) {
        function fr(ux, uy, uw, uh, c) {
          ctx.fillStyle = c;
          ctx.fillRect(ox + ux * s, oy + uy * s, uw * s, uh * s);
        }
        function wheel(ux, uy) {
          fr(ux, uy, 5, 4, carColors.tire);
          fr(ux + 1, uy + 1, 3, 2, carColors.rim);
          fr(ux + 2, uy + 1, 1, 2, carColors.shadow);
        }

        // ground shadow
        fr(2, 10, 20, 1, carColors.shadow);

        // —— chassis / lower body (continuous rocker with arch gaps) ——
        fr(1, 5, 22, 3, carColors.body);
        fr(1, 7, 22, 1, carColors.dark);

        // cut wheel arches (paint road color over body)
        fr(3, 6, 5, 2, P.road);
        fr(16, 6, 5, 2, P.road);

        // —— trunk (left) ——
        fr(1, 3, 5, 3, carColors.body);
        fr(1, 3, 5, 1, carColors.dark);
        fr(0, 4, 1, 2, carColors.dark);           // rear bumper
        fr(0, 3, 1, 2, carColors.tail);            // taillight stack
        fr(0, 5, 1, 1, "#FF6B81");

        // —— cabin ——
        fr(5, 1, 8, 1, carColors.dark);            // roof line
        fr(5, 2, 8, 3, carColors.body);
        // side window
        fr(6, 2, 6, 2, carColors.glass);
        fr(7, 2, 4, 1, carColors.glassLite);       // highlight
        // door crease
        fr(10, 4, 1, 2, carColors.mid);

        // —— windshield steps (rake toward nose/right) ——
        fr(12, 1, 1, 1, carColors.dark);
        fr(12, 2, 2, 2, carColors.glass);
        fr(13, 3, 2, 1, carColors.glass);
        fr(14, 3, 1, 1, carColors.mid);
        fr(13, 4, 3, 2, carColors.body);

        // —— hood ——
        fr(15, 4, 7, 2, carColors.body);
        fr(16, 4, 5, 1, carColors.mid);
        fr(20, 5, 3, 2, carColors.dark);           // front bumper
        fr(21, 4, 2, 1, carColors.head);           // headlight
        fr(22, 4, 1, 1, "#FFFFFF");

        // —— wheels (clearance below body) ——
        wheel(3, 7);
        wheel(16, 7);

        // headlight — solid pixels, no alpha (alpha compositing flickers on iOS)
        fr(23, 4, 8, 1, "#6A5A28");
        fr(23, 5, 4, 1, "#3A3218");

        // taillight — solid, no glow pass
        fr(-1, 4, 1, 2, "#8A2038");
      }

      function drawSky() {
        rect(0, 0, W, 40, P.sky0);
        rect(0, 40, W, 40, P.sky1);
        rect(0, 80, W, HORIZON - 80, P.sky2);
        if (theme !== "D") {
          for (var i = 0; i < stars.length; i++) {
            var st = stars[i];
            // Stable stars — no blink
            ctx.globalAlpha = st.a;
            px(st.x, st.y, "#ffffff");
          }
          ctx.globalAlpha = 1;
        }
      }

      // 4-row glyphs stay inside neon frame (inner height = 5)
      var BANNER_GLYPHS = {
        Q: { w: 4, g: ["0110", "1001", "1001", "0111"] },
        w: { w: 5, g: ["10001", "10001", "10101", "01010"] },
        i: { w: 1, g: ["1", "0", "1", "1"] },
        q: { w: 3, g: ["010", "101", "111", "001"] },
        l: { w: 2, g: ["10", "10", "10", "11"] },
        y: { w: 3, g: ["101", "101", "010", "010"] }
      };
      var BANNER_LABEL = "Qwiqly";
      var BANNER_TEXT_W = (function () {
        var tw = 0;
        for (var i = 0; i < BANNER_LABEL.length; i++) {
          var ch = BANNER_GLYPHS[BANNER_LABEL.charAt(i)];
          if (!ch) continue;
          tw += ch.w;
          if (i < BANNER_LABEL.length - 1) tw += 1;
        }
        return tw;
      })();
      var BANNER_PAD = 2; // side inset from neon frame

      function drawBannerText(x, y, w, color) {
        var innerW = w - BANNER_PAD * 2;
        if (innerW < BANNER_TEXT_W) return;
        var gx = (x + BANNER_PAD + ((innerW - BANNER_TEXT_W) / 2) | 0) | 0;
        var gy = y | 0;
        var xMin = x + BANNER_PAD;
        var xMax = x + w - BANNER_PAD;
        for (var ci = 0; ci < BANNER_LABEL.length; ci++) {
          var spec = BANNER_GLYPHS[BANNER_LABEL.charAt(ci)];
          if (!spec) continue;
          for (var ry = 0; ry < spec.g.length; ry++) {
            var row = spec.g[ry];
            for (var rx = 0; rx < spec.w; rx++) {
              if (row.charAt(rx) !== "1") continue;
              var pxX = gx + rx;
              if (pxX < xMin || pxX >= xMax) continue;
              px(pxX, gy + ry, color);
            }
          }
          gx += spec.w + 1;
        }
      }

      function drawCity() {
        var shift = (t * 1.6) | 0;
        for (var i = 0; i < buildings.length; i++) {
          var b = buildings[i];
          var x = wrapX(b.x - shift, CITY_SPAN) - 24;
          if (x > W || x + b.w < -2) continue;
          var y = HORIZON - b.h;
          rect(x, y, b.w, b.h, b.c);

          var banW = b.w - 4;
          var showBanner = b.banner && banW >= BANNER_TEXT_W + BANNER_PAD * 2 + 2;
          // neon frame: 1px top + 4px text + 1px gap + 1px bottom = 7
          var banY = y + 3;
          var banH = 7;
          var winStartY = showBanner ? (banY + banH + 2) : (y + 4);

          for (var wy = winStartY; wy < HORIZON - 3; wy += 6) {
            for (var wx = x + 3; wx < x + b.w - 3; wx += 5) {
              var lit = ((wx * 7 + wy * 5 + b.seed) % 9) < 4;
              rect(wx, wy, 2, 2, lit ? P.winOn : P.winOff);
            }
          }

          if (showBanner) {
            rect(x + 2, banY, banW, banH, "#0A0A0A");
            rect(x + 2, banY, banW, 1, b.neon);           // top rail
            rect(x + 2, banY + banH - 1, banW, 1, b.neon); // bottom rail
            // text in rows banY+1 .. banY+4 (between rails)
            drawBannerText(x + 2, banY + 1, banW, b.neon);
          } else {
            rect(x + 1, y - 2, b.w - 2, 2, b.neon);
          }
        }
        rect(0, HORIZON - 1, W, 1, P.curb);
      }

      function drawRoad() {
        rect(0, HORIZON, W, H - HORIZON, P.road);
        rect(0, HORIZON, W, 3, P.curb);
        /* 1px per frame — a 5px jump read as flicker under the car */
        var lx = -wrapX(t, 18);
        for (; lx < W; lx += 18) rect(lx, HORIZON + 28, 10, 3, P.line);
        rect(0, H - 5, W, 5, P.curb);
      }

      function drawCar() {
        // scale 4 → ~96×44 px car on 320×180 — clearly readable on iPad
        var s = 4;
        var ox = 70;
        var oy = HORIZON + 8;
        drawCarShape(ox, oy, s);
      }

      function drawRain() {
        if (!P.rain) return;
        /* Behind the car. Slow 1px steps — fast modulo jumps strobe on the sprite. */
        var carL = 68;
        var carT = HORIZON + 6;
        var carR = 70 + 24 * 4;
        var carB = HORIZON + 8 + 12 * 4;
        ctx.fillStyle = "#9BB0D0";
        for (var i = 0; i < P.rain; i++) {
          var rx = (i * 41 + (t * 2)) % W;
          var ry = (i * 29 + (t * 2)) % (H + 6);
          if (rx >= carL && rx <= carR && ry >= carT && ry <= carB) continue;
          ctx.fillRect(rx, ry, 1, 4);
        }
      }

      function tickEq() {
        for (var i = 0; i < eqNodes.length; i++) {
          var h = media.playing ? (3 + rnd(10)) : (2 + (i % 3));
          eqNodes[i].style.height = h + "px";
        }
      }

      function sign(x, y, color) {
        drawBannerText(x, y, BANNER_TEXT_W + BANNER_PAD * 2, color);
      }

      function clipCall(x, y, w, h, fn) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.clip();
        fn();
        ctx.restore();
      }

      function paintCity(dy) {
        ctx.save();
        if (dy) ctx.translate(0, dy);
        drawSky();
        drawCity();
        ctx.restore();
      }

      function linePx(x0, y0, x1, y1, color) {
        ctx.fillStyle = color;
        var dx = Math.abs(x1 - x0);
        var dy = Math.abs(y1 - y0);
        var sx = x0 < x1 ? 1 : -1;
        var sy = y0 < y1 ? 1 : -1;
        var err = dx - dy;
        var guard = 0;
        while (guard < 400) {
          ctx.fillRect(x0, y0, 1, 1);
          if (x0 === x1 && y0 === y1) break;
          var e2 = err * 2;
          if (e2 > -dy) { err -= dy; x0 += sx; }
          if (e2 < dx) { err += dx; y0 += sy; }
          guard++;
        }
      }

      function ring(cx, cy, r, color) {
        var x = r;
        var y = 0;
        var d = 1 - r;
        ctx.fillStyle = color;
        while (y <= x) {
          ctx.fillRect(cx + x, cy + y, 1, 1);
          ctx.fillRect(cx + y, cy + x, 1, 1);
          ctx.fillRect(cx - y, cy + x, 1, 1);
          ctx.fillRect(cx - x, cy + y, 1, 1);
          ctx.fillRect(cx - x, cy - y, 1, 1);
          ctx.fillRect(cx - y, cy - x, 1, 1);
          ctx.fillRect(cx + y, cy - x, 1, 1);
          ctx.fillRect(cx + x, cy - y, 1, 1);
          y++;
          if (d < 0) d += 2 * y + 1;
          else { x--; d += 2 * (y - x) + 1; }
        }
      }

      function neonPlate(x, y, w, h) {
        rect(x - 2, y - 2, w + 4, h + 4, P.neon[0]);
        rect(x, y, w, h, "#07070A");
      }

      function fillDisc(cx, cy, r, color) {
        ctx.fillStyle = color;
        var r2 = r * r;
        for (var y = -r; y <= r; y++) {
          var x0 = 0;
          var span = 0;
          var on = false;
          for (var x = -r; x <= r; x++) {
            if ((x * x + y * y) <= r2) {
              if (!on) { x0 = x; on = true; span = 1; }
              else span++;
            } else if (on) {
              ctx.fillRect(cx + x0, cy + y, span, 1);
              on = false;
            }
          }
          if (on) ctx.fillRect(cx + x0, cy + y, span, 1);
        }
      }

      function paintDrive(dy) {
        ctx.save();
        if (dy) ctx.translate(0, dy);
        drawSky();
        drawCity();
        drawRoad();
        drawRain();
        drawCar();
        ctx.restore();
      }

      function bezel(x, y, w, h, thick) {
        rect(x, y, w, thick, P.carDark);
        rect(x, y + h - thick, w, thick, P.carDark);
        rect(x, y, thick, h, P.carDark);
        rect(x + w - thick, y, thick, h, P.carDark);
      }

      function paneRain(x, y, w, h, n) {
        var i;
        for (i = 0; i < n; i++) {
          var rx = x + ((i * 37) % (w - 4));
          var ry = y + ((i * 19 + t) % (h - 6));
          rect(rx, ry, 1, 5, P.light);
        }
      }

      function drawCup(x, y) {
        rect(x, y + 8, 26, 18, P.car);
        rect(x + 3, y + 11, 20, 5, P.carDark);
        rect(x + 24, y + 12, 7, 8, P.carMid);
        fillDisc(x + 13, y + 8, 7, P.carDark);
        fillDisc(x + 13, y + 8, 4, P.light);
        var s = t % 14;
        px(x + 10, y + 2 - s, P.light);
        px(x + 16, y - ((s + 5) % 14), P.winOn);
      }

      function drawCafe() {
        paintDrive(0);
        rect(0, 0, W, 24, "#07080C");
        neonPlate(108, 3, 104, 18);
        sign(122, 6, P.neon[0]);
        rect(0, 124, W, 56, P.road);
        rect(0, 124, W, 3, P.line);
        var i;
        for (i = 0; i < 6; i++) rect(0, 134 + i * 7, W, 1, P.sky0);
        drawCup(18, 98);
        for (i = 0; i < 6; i++) {
          rect(236 + i * 13, 102, 7, 22, P.neon[i % P.neon.length]);
          rect(238 + i * 13, 104, 2, 7, P.light);
        }
        bezel(0, 24, W, 102, 4);
      }

      function drawRainWindow() {
        paintDrive(0);
        paneRain(10, 10, 300, 160, 26);
        bezel(0, 0, W, H, 6);
      }

      function drawRoofs() {
        paintDrive(0);
        fillDisc(274, 22, 11, P.light);
        fillDisc(278, 20, 9, P.sky0);
        rect(0, 138, W, 42, "#07080C");
        var i;
        for (i = 0; i < 16; i++) rect(i * 20, 142, 16, 2, P.build[i % P.build.length]);
        rect(0, 138, W, 3, P.curb);
        rect(16, 114, 14, 28, P.build[0]);
        rect(12, 110, 22, 5, P.carDark);
        rect(300, 108, 2, 32, P.carMid);
        px(301, 106, (t % 28) < 20 ? P.line : P.carDark);
        neonPlate(200, 114, 96, 20);
        sign(212, 118, P.neon[0]);
      }

      function drawSeat(x, y) {
        rect(x, y, 58, 26, P.build[0]);
        rect(x + 4, y + 4, 50, 8, P.carDark);
        rect(x + 6, y + 6, 16, 3, P.curb);
        rect(x, y + 20, 58, 6, P.carMid);
      }

      function drawTrain() {
        rect(0, 0, W, H, "#07080C");
        clipCall(10, 26, 300, 112, function () { paintDrive(8); });
        bezel(6, 22, 308, 120, 5);
        neonPlate(112, 3, 96, 16);
        sign(124, 5, P.line);
        rect(0, 146, W, 34, P.sky0);
        drawSeat(14, 148);
        drawSeat(248, 148);
      }

      function drawVinyl() {
        paintDrive(0);
        rect(0, 152, W, 28, "#07080C");
        fillDisc(86, 100, 64, "#0A0A0A");
        fillDisc(86, 100, 58, "#141414");
        var gr;
        for (gr = 20; gr <= 54; gr += 4) ring(86, 100, gr, "#2A2A2A");
        fillDisc(86, 100, 16, P.neon[0]);
        fillDisc(86, 100, 4, "#07080C");
        linePx(86, 100, 86 + ((t % 30) - 15), 86, P.light);
        linePx(162, 40, 112, 82, P.car);
        linePx(163, 41, 113, 83, P.carMid);
        fillDisc(162, 38, 5, P.light);
        rect(188, 36, 118, 108, P.sky1);
        rect(188, 36, 118, 3, P.neon[0]);
        rect(188, 141, 118, 3, P.neon[0]);
        clipCall(196, 44, 102, 36, function () { paintDrive(-30); });
        neonPlate(196, 86, 100, 18);
        sign(208, 89, P.neon[0]);
        var k;
        for (k = 0; k < 14; k++) {
          var bh = 5 + ((t + k * 3) % 16);
          rect(8 + k * 8, 150 - bh, 5, bh, P.eq);
        }
      }

      function drawPier() {
        paintDrive(-6);
        fillDisc(34, 22, 10, P.light);
        fillDisc(38, 20, 8, P.sky1);
        rect(0, 112, W, 68, "#061018");
        var row;
        for (row = 0; row < 8; row++) {
          var y = 116 + row * 6;
          var x = -((t + row * 2) % 12);
          for (; x < W; x += 12) rect(x, y, 6, 1, row % 2 ? P.sky2 : P.road);
        }
        var plank;
        for (plank = 0; plank < 4; plank++) {
          var py = 146 + plank * 8;
          var inset = 36 - plank * 8;
          if (inset < 4) inset = 4;
          rect(inset, py, W - inset * 2, 6, P.build[plank % P.build.length]);
          rect(inset, py, W - inset * 2, 1, P.line);
        }
        rect(286, 86, 4, 64, P.carDark);
        neonPlate(186, 70, 96, 18);
        sign(198, 73, P.neon[0]);
      }
      function moveScene() {
        if (scene === "drive" && window.animDrive) animDrive(ctx, t, P);
        else if (scene === "cafe" && window.animCafe) animCafe(ctx, t, P);
        else if (scene === "rain" && window.animRain) animRain(ctx, t, P);
        else if (scene === "roofs" && window.animRoofs) animRoofs(ctx, t, P);
        else if (scene === "train" && window.animTrain) animTrain(ctx, t, P);
        else if (scene === "vinyl" && window.animVinyl) animVinyl(ctx, t, P);
        else if (scene === "pier" && window.animPier) animPier(ctx, t, P);
      }

      function frame() {
        t++;
        if ((t % 3) === 0) tickEq();
      }

      var artRev = -1;
      var artEl = document.getElementById("art");
      var srcEl = document.getElementById("src");
      var tickerSig = "";
      var tickerOffset = 0;
      var tickerHalf = 0;
      var tickerTimer = null;

      function escHtml(s) {
        return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function tickScroll() {
        var track = document.getElementById("tickerTrack");
        if (!track) return;
        if (tickerHalf < 20) {
          tickerHalf = (track.offsetWidth / 2) | 0;
          if (tickerHalf < 20) return;
        }
        tickerOffset -= 1;
        if (-tickerOffset >= tickerHalf) tickerOffset = 0;
        track.style.webkitTransform = "translateX(" + tickerOffset + "px)";
        track.style.transform = "translateX(" + tickerOffset + "px)";
      }

      function startTickerScroll() {
        if (!tickerTimer) tickerTimer = setInterval(tickScroll, 28);
      }

      function renderTicker(ticker) {
        if (!ticker || !ticker.items || !ticker.items.length) return;
        var parts = [];
        for (var i = 0; i < ticker.items.length; i++) {
          var tx = escHtml(ticker.items[i].text || "");
          if (tx) parts.push("<span>" + tx + "</span>");
        }
        if (!parts.length) return;
        var sig = parts.join("|");
        if (sig === tickerSig) { startTickerScroll(); return; }
        tickerSig = sig;
        var html = parts.join('<span class="sep"> · </span>');
        var track = document.getElementById("tickerTrack");
        track.innerHTML = html + '<span class="sep"> · </span>' + html;
        tickerOffset = 0; tickerHalf = 0;
        track.style.webkitTransform = "translateX(0)";
        track.style.transform = "translateX(0)";
        setTimeout(function () {
          tickerHalf = (track.offsetWidth / 2) | 0;
          startTickerScroll();
        }, 40);
      }

      function fetchTicker() {
        if (GC) {
          GC.fetchNews(function (ticker) { renderTicker(ticker); });
          return;
        }
        var xhr = new XMLHttpRequest();
        xhr.open("GET", hubPath("/api/ticker"), true);
        xhr.timeout = 4000;
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4 && xhr.status === 200) {
            try { renderTicker(JSON.parse(xhr.responseText)); } catch (e) {}
          }
        };
        xhr.send(null);
      }

      function renderLiving(living) {
        if (!living) return;
        var w = living.weather, a = living.alert;
        var wEl = document.getElementById("lvWeatherVal");
        var aEl = document.getElementById("lvAlert");
        if (w && (w.temp_c != null)) {
          wEl.textContent = w.temp_c + "° · " + (w.label || "");
        } else if (w && w.text) {
          wEl.textContent = w.text;
        } else {
          wEl.textContent = "Kyiv · …";
        }
        if (a) {
          document.getElementById("lvAlertVal").textContent = a.label || "…";
          document.getElementById("lvAlertSub").textContent = a.place || "Kyiv";
          aEl.className = a.alert ? "card lv-alert on" : "card lv-alert";
        }
      }

      function fetchLiving() {
        if (GC && GC.readLivingCache) {
          var cached = GC.readLivingCache();
          if (cached) renderLiving(cached);
        }
        if (GC) {
          GC.fetchLivingBundle(function (living) { renderLiving(living); });
          return;
        }
        var xhr = new XMLHttpRequest();
        xhr.open("GET", hubPath("/api/living"), true);
        xhr.timeout = 4000;
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4 && xhr.status === 200) {
            try { renderLiving(JSON.parse(xhr.responseText)); } catch (e) {}
          }
        };
        xhr.send(null);
      }

      var mediaQuiet = false;
      function fetchMedia() {
        if (mediaQuiet) return;
        if (pageMode === "solo") {
          var rn = GC && GC.readRadioNow ? GC.readRadioNow() : { playing: false };
          media.playing = !!rn.playing;
          media.title = rn.name || "";
          media.artist = rn.playing ? "Radio · live" : "Radio";
          document.getElementById("cap").textContent = media.title
            ? ((media.playing ? "▶ " : "❚❚ ") + media.title)
            : P.caption;
          srcEl.textContent = media.artist || "standalone";
          artEl.className = "";
          artEl.removeAttribute("src");
          return;
        }
        var xhr = new XMLHttpRequest();
        xhr.open("GET", hubPath("/api/nowplaying"), true);
        xhr.timeout = 3000;
        xhr.onreadystatechange = function () {
          if (xhr.readyState !== 4) return;
          if (xhr.status !== 200) { mediaQuiet = true; return; }
          try {
            var d = JSON.parse(xhr.responseText);
            media.playing = !!d.playing;
            media.title = d.title || "";
            media.artist = d.artist || "";
            var cap = document.getElementById("cap");
            cap.textContent = media.title
              ? ((media.playing ? "▶ " : "❚❚ ") + media.title)
              : P.caption;
            var sub = media.artist || "";
            if (d.app_label || d.app) sub = sub ? (sub + " · " + (d.app_label || d.app)) : (d.app_label || d.app);
            srcEl.textContent = sub;
            if (d.has_art && d.art_rev) {
              if (artRev !== d.art_rev) {
                artRev = d.art_rev;
                artEl.src = hubPath("/api/cover?r=" + artRev);
              }
              artEl.className = "on";
            } else {
              artRev = -1;
              artEl.removeAttribute("src");
              artEl.className = "";
            }
          } catch (e) {}
        };
        xhr.onerror = function () { mediaQuiet = true; };
        xhr.ontimeout = function () { mediaQuiet = true; };
        xhr.send(null);
      }

      sceneGif.onload = function () {
        gifOn = true;
        sceneGif.className = "scene-gif on";
        lastFitKey = "";
        try { fitCanvas(); } catch (eG) {}
      };
      sceneGif.className = "scene-gif on";
      sceneGif.src = sceneFile(scene, theme);
      fitCanvas();
      setTimeout(fitCanvas, 80);
      setTimeout(fitCanvas, 400);
      setTimeout(fitCanvas, 900);
      if (window.addEventListener) {
        window.addEventListener("resize", fitCanvas, false);
        window.addEventListener("orientationchange", function () {
          lastFitKey = "";
          setTimeout(fitCanvas, 200);
        }, false);
        window.addEventListener("pageshow", function () {
          lastFitKey = "";
          setTimeout(fitCanvas, 50);
        }, false);
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) {
            lastFitKey = "";
            fitCanvas();
          }
        }, false);
      }

      setInterval(frame, 80);
      // Living/ticker always from client APIs; media only when hub deck mode
      setInterval(fetchTicker, 60000);
      setInterval(fetchLiving, 45000);
      fetchTicker();
      fetchLiving();
      if (!fillMode) {
        setInterval(fetchMedia, 1500);
        fetchMedia();
      }
      frame();
    })();
  </script>
</body>
</html>
