        while (row.length < W) row += ".";
        return row;
      }

      function drawFrame(frame) {
        ctx.clearRect(0, 0, W, H);
        var y, x, row, ch, color;
        for (y = 0; y < H; y++) {
          row = padRow(frame[y] || "");
          for (x = 0; x < W; x++) {
            ch = row.charAt(x);
            color = map[ch];
            if (color) {
              ctx.fillStyle = color;
              ctx.fillRect(x, y, 1, 1);
            }
          }
        }
      }

      var i = 0;
      drawFrame(frames[0]);
      setInterval(function () {
        i = (i + 1) % frames.length;
        drawFrame(frames[i]);
      }, 150);
